[[entry]]
path = "forwin/review/llm_webnovel.py"
symbol = "LLMWebNovelReviewer._llm_review_messages"
checks = ["cjk_collection"]
category = "prompt_text"
justification = "Review, JSON repair and scope escalation instructions."
max_literals = 2
literals = ["你是 Web-Novel Experience Reviewer。只输出 JSON。你审查的是网文体验而不是文学腔：看爽点兑现、问题梯子、沉浸感、规则可读性、拖感是否仍有推进。所有 warn/fail issue 必须引用给定 evidence_id。同时检查人物是否符合 active_personality_context，但人格 skill 不能覆盖 canon。draft.body 是待评审的完整最终正文；正文问题必须以它为准。摘要与结构化状态、事件、时间候选用于交叉核验，不能代替最终正文。canon invariant 优先于章节计划、摘要和本章声称；静默改写规则定义必须 fail。已接受后续章节的冻结锚点同样属于 canon invariant：历史重写不得提前完成、重排、否定或改写其结果。", "f'请根据下面数据审查当前章节，只返回 JSON 对象。\\n顶层字段必须包含：verdict、planned_reward_tags、delivered_reward_tags、experience_scores、issues、review_notes、repair_instruction、evidence_refs、review_summary。\\nexperience_scores 固定包含：narrative_understanding、attentional_focus、emotional_engagement、narrative_presence、payoff_delivery、stall_tolerance、hook_efficiency，分值 0 到 1。\\nissues 每项必须包含：rule_name、severity、description、issue_type、target_scope、evidence_refs、suggested_fix。warn/fail issue 的 evidence_refs 必须全部来自允许列表。\\nrepair_instruction 可以为 null，否则必须包含：repair_scope(draft/chapter_plan/band_plan)、failure_type、must_fix、must_preserve、design_patch、evidence_refs。\\nmust_fix 只能对应 severity=error 的 issue；warning 只能保留为建议，不得升级为硬修复项。\\n若章节拖但仍有问题梯子/微进展/关系变化/规则稳态，只能给 warn 或 pass，不能给 fail。\\n人物一致性检查：决策是否符合 dominant skill；对白是否符合 expression/social mask；压力反应是否符合 stress mode；是否把倾向误写成绝对规则；是否由 skill 发明新 canon。\\n只有当 no-payoff stall 连续成立，或出现因果/stakes/规则可读性断裂且能指向证据时，才给 fail。\\n允许引用的 evidence_id：{json.dumps(evidence_ids, ensure_ascii=False)}\\n审查数据：{json.dumps(payload, ensure_ascii=False)}'"]

