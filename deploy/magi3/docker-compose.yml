name: forwin

# Package mirrors for image builds: pypi.org, deb.debian.org, registry.npmjs.org and
# Playwright's CDN crawl or time out from magi3. Override any of them in .env (README,
# "Builds from China").
x-build-mirrors: &build-mirrors
  PIP_INDEX_URL: &pip-index-url "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
  DEBIAN_MIRROR: "${DEBIAN_MIRROR:-mirrors.tuna.tsinghua.edu.cn}"
  NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"

x-runtime-build: &runtime-build
  context: ../..
  target: forwin-runtime
  args: *build-mirrors

x-runtime-service: &runtime-service
  image: forwin-forwin:magi3
  build: *runtime-build
  env_file:
    - .env
  restart: unless-stopped

x-common-environment: &common-environment
  # In-container service names only. Nothing here points at an external host.
  FORWIN_DATABASE_URL: "postgresql+psycopg://forwin:${FORWIN_POSTGRES_PASSWORD}@postgres:5432/forwin"
  FORWIN_QDRANT_URL: "http://qdrant:6333"
  FORWIN_QDRANT_COLLECTION: "chapter_memories"
  FORWIN_LLM_KB_QDRANT_COLLECTION: "llm_kb_vectors"
  FORWIN_RETRIEVAL_BACKEND: "qdrant"
  # Artifacts live on the forwin-data volume; magi3 runs no object store.
  FORWIN_ARTIFACT_BACKEND: "local"
  FORWIN_ARTIFACT_ROOT: "data/artifacts"
  FORWIN_RUNTIME_SETTINGS_PATH: "data/runtime_settings.json"
  FORWIN_HTTP_BIND: "0.0.0.0"
  FORWIN_ALLOW_BIND_ALL_INTERFACES: "true"
  FORWIN_ALLOW_UNAUTHENTICATED_LAN: "true"
  # Embeddings come from the embedding service below (all-MiniLM-L6-v2, 384 dimensions), as on infra-150.
  FORWIN_EMBEDDING_BACKEND: "gateway"
  FORWIN_EMBEDDING_BASE_URL: "http://embedding:8080"
  FORWIN_EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  FORWIN_EMBEDDING_DIMS: "384"
  FORWIN_EMBEDDING_REQUIRED: "${FORWIN_EMBEDDING_REQUIRED:-false}"
  # Review and checkpoint behavior comes from each project RuntimePolicy.
  # See env.example for the current policy controls.
  FORWIN_EXTENSION_TEST_PROFILE: "/app/data/chrome_profiles/forwin-extension"
  FORWIN_EXTENSION_REQUIRE_QUALIFIED_PROFILE: "${FORWIN_EXTENSION_REQUIRE_QUALIFIED_PROFILE:-true}"
  FORWIN_EXTENSION_AUTO_QUALIFY_PROFILE: "${FORWIN_EXTENSION_AUTO_QUALIFY_PROFILE:-true}"
  FORWIN_EXTENSION_RESTORE_BACKEND_SESSIONS: "${FORWIN_EXTENSION_RESTORE_BACKEND_SESSIONS:-false}"
  FORWIN_EXTENSION_STARTUP_HEARTBEAT_TIMEOUT_SECONDS: "${FORWIN_EXTENSION_STARTUP_HEARTBEAT_TIMEOUT_SECONDS:-75}"
  FORWIN_PUBLISHER_HEARTBEAT_STALE_SECONDS: "${FORWIN_PUBLISHER_HEARTBEAT_STALE_SECONDS:-300}"
  FORWIN_PUBLISHER_HEARTBEAT_MONITOR_INTERVAL_SECONDS: "${FORWIN_PUBLISHER_HEARTBEAT_MONITOR_INTERVAL_SECONDS:-30}"
  FORWIN_PUBLISHER_HEARTBEAT_MONITOR_FAILURES: "${FORWIN_PUBLISHER_HEARTBEAT_MONITOR_FAILURES:-2}"
  FORWIN_PUBLISHER_STRICT_PREFERRED_CLIENT: "${FORWIN_PUBLISHER_STRICT_PREFERRED_CLIENT:-true}"
  FORWIN_PUBLISHER_SESSION_ENCRYPTION_REQUIRED: "${FORWIN_PUBLISHER_SESSION_ENCRYPTION_REQUIRED:-true}"
  FORWIN_PUBLISHER_PREFERRED_CLIENT_ID: "${FORWIN_PUBLISHER_PREFERRED_CLIENT_ID:-}"
  FORWIN_PUBLISHER_EXTENSION_API_KEY: "${FORWIN_PUBLISHER_EXTENSION_API_KEY:-}"
  FORWIN_PUBLISHER_SESSION_SECRET: "${FORWIN_PUBLISHER_SESSION_SECRET:-}"
  DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
  DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}"
  DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
  KIMI_API_KEY: "${KIMI_API_KEY:-}"
  KIMI_BASE_URL: "${KIMI_BASE_URL:-https://api.moonshot.cn/v1}"
  KIMI_MODEL: "${KIMI_MODEL:-kimi-k2.5}"
  MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
  MINIMAX_BASE_URL: "${MINIMAX_BASE_URL:-https://api.minimaxi.com/v1}"
  MINIMAX_MODEL: "${MINIMAX_MODEL:-MiniMax-M2.7}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "forwin"
      POSTGRES_PASSWORD: "${FORWIN_POSTGRES_PASSWORD:?FORWIN_POSTGRES_PASSWORD must be set in deploy/magi3/.env}"
      POSTGRES_DB: "forwin"
    volumes:
      - forwin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.1
    volumes:
      - forwin-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped


  embedding:
    image: forwin-embedding-gateway:magi3
    build:
      context: ./embedding-gateway
      args:
        PIP_INDEX_URL: *pip-index-url
        HF_ENDPOINT: "${HF_ENDPOINT:-https://hf-mirror.com}"
    environment:
      EMBED_MODEL: "all-MiniLM-L6-v2"
      EMBED_DEVICE: "cpu"
      EMBED_CACHE_SIZE: "16384"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  publish-hub-tunnel:
    # ssh forward to publish-hub (magi2:18930, through the VPS). The colima VM cannot reach
    # ports on the magi3 host, so the forward runs in this network and callers use
    # http://publish-hub-tunnel:18930. Idles until FORWIN_PUBLISH_HUB_TUNNEL_TARGET and the
    # key in ~/forwin/publish-hub-tunnel are set up (README, "publish-hub tunnel").
    image: forwin-publish-hub-tunnel:magi3
    build:
      context: ./publish-hub-tunnel
      args:
        ALPINE_MIRROR: "${ALPINE_MIRROR:-mirrors.aliyun.com}"
    environment:
      PUBLISH_HUB_TUNNEL_TARGET: "${FORWIN_PUBLISH_HUB_TUNNEL_TARGET:-}"
    volumes:
      - "${HOME}/forwin/publish-hub-tunnel:/run/publish-hub-tunnel:ro"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    mem_limit: 32m
    healthcheck:
      # Through the tunnel to publish-hub itself, so a down magi2 shows here too.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "5", "http://127.0.0.1:18930/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  app:
    <<: *runtime-service
    command: ["uvicorn", "forwin.api:app", "--host", "0.0.0.0", "--port", "8899"]
    environment:
      <<: *common-environment
      FORWIN_PUBLISHER_COVER_DIR: "/app/data/publisher_covers"
      # publish-hub URL (http://publish-hub-tunnel:18930) and key from deploy/magi3/.env; empty leaves publish-hub off.
      FORWIN_PUBLISH_HUB_URL: "${FORWIN_PUBLISH_HUB_URL:-}"
      FORWIN_PUBLISH_HUB_API_KEY: "${FORWIN_PUBLISH_HUB_API_KEY:-}"
      FORWIN_PUBLISH_HUB_TIMEOUT_SECONDS: "${FORWIN_PUBLISH_HUB_TIMEOUT_SECONDS:-20}"
    ports:
      - "127.0.0.1:8899:8899"
    networks:
      default:
        # The publisher extension's backend name (FORWIN_BACKEND_URL of publisher-browser).
        aliases: ["forwin-app"]
    volumes:
      - forwin-data:/app/data
    depends_on:
      embedding:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; r=httpx.get('http://localhost:8899/health', timeout=3); raise SystemExit(0 if r.status_code == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mcp:
    <<: *runtime-service
    command: ["python", "-m", "uvicorn", "forwin.mcp.http:app", "--host", "0.0.0.0", "--port", "8896"]
    environment:
      <<: *common-environment
      FORWIN_API_BASE_URL: "http://app:8899"
      FORWIN_MCP_API_TIMEOUT_SECONDS: "${FORWIN_MCP_API_TIMEOUT_SECONDS:-300}"
      FORWIN_MCP_HOST: "0.0.0.0"
      FORWIN_MCP_PORT: "8896"
    ports:
      - "127.0.0.1:8896:8896"
    volumes:
      - forwin-data:/app/data
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; r=httpx.get('http://localhost:8896/health', timeout=3); raise SystemExit(0 if r.status_code == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  generation-worker:
    <<: *runtime-service
    command: ["python", "-m", "forwin.cli", "-v", "generation-worker", "--worker-id", "forwin-generation-worker", "--lease-seconds", "300", "--poll-interval", "2"]
    environment:
      <<: *common-environment
    volumes:
      - forwin-data:/app/data
    depends_on:
      embedding:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      disable: true

  outbox-worker:
    <<: *runtime-service
    command: ["python", "-m", "forwin.cli", "-v", "outbox-worker", "--worker-id", "forwin-outbox-worker", "--poll-interval", "2"]
    environment:
      <<: *common-environment
    volumes:
      - forwin-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  publisher-worker:
    <<: *runtime-service
    command: ["python", "-m", "forwin.cli", "-v", "publisher-worker", "--limit", "1", "--poll-interval", "2"]
    environment:
      <<: *common-environment
      FORWIN_PUBLISHER_COVER_DIR: "/app/data/publisher_covers"
      # publish-hub URL (http://publish-hub-tunnel:18930) and key from deploy/magi3/.env; empty leaves publish-hub off.
      FORWIN_PUBLISH_HUB_URL: "${FORWIN_PUBLISH_HUB_URL:-}"
      FORWIN_PUBLISH_HUB_API_KEY: "${FORWIN_PUBLISH_HUB_API_KEY:-}"
      FORWIN_PUBLISH_HUB_TIMEOUT_SECONDS: "${FORWIN_PUBLISH_HUB_TIMEOUT_SECONDS:-20}"
    volumes:
      - forwin-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  publish-hub-sync:
    # Mirrors publish-hub's job results into ForWin and refreshes the destinations cache the
    # release gate reads (forwin/publish_hub/sync.py). One round every 15 s.
    <<: *runtime-service
    command: ["python", "-m", "forwin.cli", "publish-hub-sync"]
    restart: unless-stopped
    # Peak about 110 MiB (more once a cover is queued and the settings models load); an OOM
    # restart loop would stall every send silently, so keep room.
    mem_limit: 256m
    environment:
      <<: *common-environment
      # publish-hub URL (http://publish-hub-tunnel:18930) and key from deploy/magi3/.env; empty leaves publish-hub off.
      FORWIN_PUBLISH_HUB_URL: "${FORWIN_PUBLISH_HUB_URL:-}"
      FORWIN_PUBLISH_HUB_API_KEY: "${FORWIN_PUBLISH_HUB_API_KEY:-}"
      FORWIN_PUBLISH_HUB_TIMEOUT_SECONDS: "${FORWIN_PUBLISH_HUB_TIMEOUT_SECONDS:-20}"
    volumes:
      - forwin-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  publisher-browser:
    image: forwin-publisher-browser:magi3
    build:
      context: ../..
      target: publisher-browser-runtime
      args:
        <<: *build-mirrors
        PLAYWRIGHT_DOWNLOAD_HOST: "${PLAYWRIGHT_DOWNLOAD_HOST:-https://registry.npmmirror.com/-/binary/playwright}"
    env_file:
      - .env
    command: ["bash", "-lc", "exec scripts/launch_linux_extension_browser.sh"]
    # The extension calls publish-hub at http://publish-hub-tunnel:18930 (URL and key in its own settings).
    environment:
      <<: *common-environment
      # Not http://app:8899: Chromium applies the HSTS preload of the .app top-level domain to the
      # bare host name "app", upgrades the extension's requests to https and they fail.
      FORWIN_BACKEND_URL: "http://forwin-app:8899"
      FORWIN_EXTENSION_DISPLAY_MODE: "${FORWIN_EXTENSION_DISPLAY_MODE:-xvfb}"
      FORWIN_EXTENSION_DISPLAY: "${FORWIN_EXTENSION_DISPLAY:-:100}"
      FORWIN_EXTENSION_XVFB_SERVER_NUM: "${FORWIN_EXTENSION_XVFB_SERVER_NUM:-100}"
      FORWIN_EXTENSION_NO_SANDBOX: "${FORWIN_EXTENSION_NO_SANDBOX:-auto}"
      FORWIN_EXTENSION_TEST_REMOTE_DEBUGGING_ADDRESS: "0.0.0.0"
      FORWIN_EXTENSION_TEST_REMOTE_DEBUGGING_PORT: "9222"
      # From China, connects to Google hang until they time out, and the colima VM's network
      # forwarder admits only 10 pending connects: Chromium's background calls to Google stalled
      # every outbound connection of the VM (builds, LLM calls, uploads). Fail those names at once.
      FORWIN_EXTENSION_HOST_RESOLVER_RULES: "${FORWIN_EXTENSION_HOST_RESOLVER_RULES:-MAP *.google.com ~NOTFOUND, MAP *.googleapis.com ~NOTFOUND, MAP *.gstatic.com ~NOTFOUND, MAP *.gvt1.com ~NOTFOUND, MAP *.gvt2.com ~NOTFOUND, MAP *.googleusercontent.com ~NOTFOUND, MAP *.google-analytics.com ~NOTFOUND, MAP *.googletagmanager.com ~NOTFOUND, MAP *.doubleclick.net ~NOTFOUND}"
    tmpfs:
      - "/dev/shm:size=1073741824,mode=1777"
    ports:
      - "127.0.0.1:9222:9222"
    volumes:
      - forwin-data:/app/data
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9222/json/version', timeout=5)\" && python scripts/check_publisher_browser_heartbeat.py --wait-seconds 0"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  migrate:
    <<: *runtime-service
    profiles: ["tools"]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *common-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  forwin-postgres:
  forwin-qdrant:
  forwin-data:
