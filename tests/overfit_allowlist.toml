# Allowlist for tests/test_no_story_content_in_runtime.py (design §7.2).
# Story content must be deleted, never allowlisted as catalog/lexicon: until its
# deletion lands it is registered as pending_removal with remove_in.
#
# One entry per (path, symbol); symbol "<file>" is the fixture_term text scan, and an
# entry without symbol covers the listed checks for the whole file. Optional
# `literals = [...]` restricts an entry to hits with those literals; it splits a symbol
# whose content is removed in different phases (e.g. P0 vs P2 canary terms in one file).
# A hit goes to its symbol entry before a file-level entry, and to a literals-restricted
# entry before an unrestricted one.
# max_literals: pending_removal must EQUAL the current count, so every trim forces an
# entry update; other categories may not exceed it (count rounded up to the next 10,
# exact below 10). Growth needs review.
# A task that trims (rather than deletes) a pending_removal symbol re-registers the
# residual content under its real category (ledger rulings R2, R6).

[meta]
completed_phase = "P2"

[story_id_literal]
allowed_values = ["main", "fact_type", "fact_id", "thread_id", "world_line_id", "fact_refs",
  "fact_conflict", "thread_closed_too_early", "thread_keep_open", "thread_already_closed",
  "thread_drift", "thread_time_extraction", "fact_nodes", "gap_between_public_and_actual",
  # protocol field / enum / ref-namespace names (not story content); "fact_" is the bare
  # prefix of generated ids such as f"fact_{new_id()}"
  "thread_beats", "thread_time", "fact_event", "fact_evidence", "fact_node", "fact_",
  # BookState v6 intent profile reference to its owning agenda.
  "agenda_ref",
  # ChapterDeltaExtraction field name used in translator issue paths.
  "intent_interactions",
  # World tick candidate origin enum token (forwin/world_engine/types.py TickCandidate.origin).
  "intent_interaction",
  # ActorTurnResult field name used in actor-turn validation issue paths.
  "agenda_changes"]

[canary]
seed_terms = [
  "母星", "殖民", "救父", "父亲被围", "father_sieged", "homeworld", "colony", "回声账",
  "恢复后门", "家族档案", "记忆重置", "记忆熔铸", "档案署", "钟塔", "民间记忆馆", "地下检修线",
  "追踪器", "磁力铐", "羁押室", "馆员", "审计员", "巡检员", "工号在线", "刻痕", "插孔",
  "memory_reset", "archive_cleanup", "terminal_audit_window", "core_access_window",
  "public_countdown", "失业档案修复师", "地下算法师", "三十万", "陆明", "韩青",
  # merged from tests/test_no_story_specific_hardcoding.py
  "d2338a0e8bfe4e00a068b03ce9e9b0bf", "旧城遗档", "白塔重置", "林澈", "沈宴秋", "洛庭若",
  "顾临川", "林远舟", "沈砚", "白塔", "岫苑", "地下旧轨", "潮汐钟楼", "失忆广场", "档案公会",
  "白塔巡检员", "林氏", "守仓阙微阑", "礼川诸州", "裴星野", "终端审计", "核心层", "档案清理",
  "熔铸协议", "隐藏子程序倒计时",
  # Task 9c review: in-story example lines leaked into the countdown hard instruction
  "系统日志原本还有",
]
harvest_keys = ["name", "display_name", "entity_name", "canonical_name"]

